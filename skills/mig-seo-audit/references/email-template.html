<!--
Contact form email layout. Table-based with inline styles, so it renders in
Gmail, Outlook and Apple Mail. Replace every {{PLACEHOLDER}} on the server and
HTML-escape every value. Repeat the details row once per detail.

Brand colours (from intake):
  {{BRAND_DARK}}    header background, such as #081523
  {{BRAND_LIGHT}}   small header text, such as #92d7df
  {{ACCENT}}        quote border, such as #3c9ab7
Neutrals: page #eef3f6, text #0f2433, muted #5b7182, lines #e6edf2, quote #f4f9fb.

{{LOGO_URL}} is an absolute https URL to a square PNG, such as the 180px
apple-touch-icon. Mail clients block SVG and relative URLs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>New contact request</title>
    <style>
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
        .plain a, u + #body .plain a { color: #0f2433 !important; text-decoration: none !important; font-weight: inherit !important; }
    </style>
</head>
<body id="body" style="margin:0; padding:0; background-color:#eef3f6; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{{PREHEADER}}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef3f6;">
        <tr>
            <td align="center" style="padding:28px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
                    <tr>
                        <td style="background-color:{{BRAND_DARK}}; border-radius:10px 10px 0 0; padding:16px 24px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="vertical-align:middle;">
                                        <img src="{{LOGO_URL}}" width="28" height="28" alt="" style="display:inline-block; vertical-align:middle; border:0; border-radius:7px;">
                                        <span style="display:inline-block; vertical-align:middle; margin-left:8px; color:#ffffff; font-size:17px; font-weight:700; letter-spacing:0.02em;">{{BRAND_NAME}}</span>
                                    </td>
                                    <td align="right" style="vertical-align:middle; color:{{BRAND_LIGHT}}; font-size:12px; line-height:1.4;">Website contact form</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#ffffff; border:1px solid #dfe8ee; border-top:0; border-radius:0 0 10px 10px; padding:28px; color:#0f2433; font-size:15px; line-height:1.55;">
                            <h1 style="margin:0 0 12px; color:#0f2433; font-size:21px; font-weight:700; line-height:1.3;">New contact request</h1>
                            <p style="margin:0 0 14px;">{{INTRO}}</p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 18px;">
                                <tr>
                                    <td style="background-color:#f4f9fb; border-left:3px solid {{ACCENT}}; border-radius:0 8px 8px 0; padding:12px 14px; font-size:14.5px; line-height:1.55; color:#0f2433;">
                                        {{MESSAGE_HTML}}
                                    </td>
                                </tr>
                            </table>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 0; font-size:14px;">
                                <!-- Repeat this row for each detail: Name, Email, Company, Phone, Plan, Language, Page -->
                                <tr>
                                    <td width="38%" style="padding:7px 12px 7px 0; border-bottom:1px solid #e6edf2; color:#5b7182; vertical-align:top;">{{LABEL}}</td>
                                    <td class="plain" style="padding:7px 0; border-bottom:1px solid #e6edf2; color:#0f2433; font-weight:700; vertical-align:top;">{{VALUE}}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:18px 10px 0; color:#6b7f8e; font-size:12px; line-height:1.6;">
                            Sent by the contact form on {{DOMAIN}}.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
